<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>spacemap</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; background: #1a1a1a; color: #fff; }
    h1 { color: #5ac8fa; }
    a { color: #5ac8fa; }
    .version { background: #2d2d2d; padding: 20px; border-radius: 8px; margin: 20px 0; }
    code { background: #333; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>spacemap</h1>
  <p>A native macOS utility that visualizes yabai workspaces in a floating 2D grid overlay.</p>
  
  <div class="version">
    <h2>Latest Version</h2>
    <p>Updates via Sparkle: <a href="appcast.xml">appcast.xml</a></p>
    <p>Download from <a href="https://github.com/jsheffie/spacemap/releases">GitHub Releases</a></p>
  </div>

  <h2>Quick Start</h2>
  <pre><code>brew install --cask spacemap</code></pre>
  
  <h2>Configuration</h2>
  <p>Edit <code>~/.config/spacemap/config.toml</code></p>
</body>
</html>
