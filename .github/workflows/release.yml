name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
  APPCAST_MAX_ITEMS: "5"

jobs:
  release:
    name: Build & Release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      - name: Install build tools
        run: |
          brew install create-dmg scdoc

      - name: Validate release version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          REPOSITORY_VERSION=$(tr -d '[:space:]' < VERSION)
          PLIST_SHORT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sources/spacemap/Info.plist)
          PLIST_BUILD_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Sources/spacemap/Info.plist)
          for value in "$REPOSITORY_VERSION" "$PLIST_SHORT_VERSION" "$PLIST_BUILD_VERSION"; do
            if [ "$value" != "$TAG_VERSION" ]; then
              echo "::error::Release tag v$TAG_VERSION does not match VERSION and Info.plist ($REPOSITORY_VERSION, $PLIST_SHORT_VERSION, $PLIST_BUILD_VERSION)"
              exit 1
            fi
          done
          echo "tag=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Verify Sparkle signing key pair
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: .github/scripts/validate-sparkle-keys.sh

      - name: Import code signing certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | awk -F '"' '{print $2}')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build app bundle (ARM64)
        run: |
          rm -rf .build
          make app-arm64 REQUIRE_SPARKLE_KEY=1

      - name: Build app bundle (x86_64)
        run: |
          rm -rf .build
          make app-x86_64 REQUIRE_SPARKLE_KEY=1

      - name: Build app bundle (universal)
        run: |
          rm -rf .build
          make app-universal REQUIRE_SPARKLE_KEY=1

      - name: Verify bundled versions and localizations
        run: |
          for bundle in spacemap-arm64.app spacemap-x86_64.app Spacemap.app; do
            make --no-print-directory verify-localizations BUNDLE="$bundle"
            bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Contents/Info.plist")
            if [ "$bundle_version" != "${{ steps.version.outputs.tag }}" ]; then
              echo "::error::$bundle contains version $bundle_version"
              exit 1
            fi
          done

      - name: Code sign and verify app bundles
        run: |
          # Sparkle treats a bundle with only a linker-signed executable as
          # unsigned. Use ad-hoc signing when a Developer ID certificate is
          # unavailable so every release remains a valid update target.
          if [ -n "${CODESIGN_IDENTITY:-}" ]; then
            SIGNING_IDENTITY="$CODESIGN_IDENTITY"
            SIGNING_OPTIONS=(--options runtime --timestamp)
          else
            SIGNING_IDENTITY="-"
            SIGNING_OPTIONS=(--options runtime)
          fi

          for bundle in spacemap-arm64.app spacemap-x86_64.app Spacemap.app; do
            if [ -d "$bundle" ]; then
              codesign --force --sign "$SIGNING_IDENTITY" \
                "${SIGNING_OPTIONS[@]}" \
                "$bundle"
              codesign --verify --deep --strict --verbose=2 "$bundle"
              echo "Signed and verified $bundle"
            fi
          done

      - name: Create DMGs
        run: |
          make _dmg INPUT=spacemap-arm64.app OUTPUT=spacemap-${{ steps.version.outputs.tag }}-arm64.dmg
          make _dmg INPUT=spacemap-x86_64.app OUTPUT=spacemap-${{ steps.version.outputs.tag }}-x86_64.dmg
          make _dmg INPUT=Spacemap.app OUTPUT=spacemap-${{ steps.version.outputs.tag }}-universal.dmg

      - name: Verify DMG architectures
        run: |
          verify_dmg() {
            local dmg="$1" expected="$2"
            local mnt="/tmp/verify-$$"
            mkdir -p "$mnt"
            hdiutil attach "$dmg" -nobrowse -quiet -mountpoint "$mnt"
            local archs
            archs=$(lipo -archs "$mnt/Spacemap.app/Contents/MacOS/Spacemap" 2>/dev/null || true)
            hdiutil detach "$mnt" -quiet 2>/dev/null || true
            rmdir "$mnt" 2>/dev/null || true
            if [ -z "$archs" ]; then
              echo "::error::Could not read architecture from $dmg"
              exit 1
            fi
            sorted_actual=$(echo "$archs" | tr ' ' '\n' | sort | tr '\n' ' ' | xargs)
            sorted_expected=$(echo "$expected" | tr ' ' '\n' | sort | tr '\n' ' ' | xargs)
            if [ "$sorted_actual" != "$sorted_expected" ]; then
              echo "::error::$dmg contains [$archs], expected [$expected]"
              exit 1
            fi
            echo "OK $dmg → $archs"
          }
          verify_dmg spacemap-${{ steps.version.outputs.tag }}-arm64.dmg arm64
          verify_dmg spacemap-${{ steps.version.outputs.tag }}-x86_64.dmg x86_64
          verify_dmg spacemap-${{ steps.version.outputs.tag }}-universal.dmg "arm64 x86_64"

      - name: Code sign DMGs
        if: env.CODESIGN_IDENTITY != ''
        run: |
          for dmg in spacemap-*-arm64.dmg spacemap-*-x86_64.dmg spacemap-*-universal.dmg; do
            if [ -f "$dmg" ]; then
              codesign --force --sign "$CODESIGN_IDENTITY" \
                --timestamp \
                "$dmg"
              echo "Signed $dmg"
            fi
          done

      - name: Notarize DMGs
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for dmg in spacemap-*-arm64.dmg spacemap-*-x86_64.dmg spacemap-*-universal.dmg; do
            if [ -f "$dmg" ]; then
              echo "Notarizing $dmg..."
              xcrun notarytool submit "$dmg" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --wait
              xcrun stapler staple "$dmg"
              echo "Notarized $dmg"
            fi
          done

      - name: Generate checksums
        run: |
          shasum -a 256 spacemap-*-arm64.dmg spacemap-*-x86_64.dmg spacemap-*-universal.dmg > checksums.txt
          cat checksums.txt

      - name: Verify Sparkle dependency pin
        run: |
          test "$(jq -r '.pins[] | select(.identity == "sparkle") | .state.version' Package.resolved)" = "2.9.5" || { echo "::error::Package.resolved Sparkle version is not 2.9.5"; exit 1; }
          test "$(jq -r '.pins[] | select(.identity == "sparkle") | .state.revision' Package.resolved)" = "79bc9e872948e47877e76f194cb0c8e0412b0b90" || { echo "::error::Package.resolved Sparkle revision mismatch"; exit 1; }
          grep -q 'exact: "2.9.5"' Package.swift || { echo "::error::Package.swift must pin Sparkle exact 2.9.5"; exit 1; }

      - name: Generate Sparkle appcast + signature
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          DMG_FILE: spacemap-${{ steps.version.outputs.tag }}-universal.dmg
          APPCAST_URL: https://wiggly-sheets.github.io/Spacemap/appcast.xml
          RELEASES_URL: https://github.com/wiggly-sheets/Spacemap/releases/download/v${{ steps.version.outputs.tag }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MAX_ITEMS: ${{ env.APPCAST_MAX_ITEMS }}
          SPARKLE_VERSION: "2.9.5"
          SPARKLE_SHA256: "015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc"
        run: |
          export DMG_SIZE=$(stat -f%z "spacemap-$VERSION-universal.dmg")
          # Pinned Sparkle sign_update tool: version + SHA256 checked before unpack.
          curl -sSL --fail "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o /tmp/Sparkle.tar.xz
          echo "${SPARKLE_SHA256}  /tmp/Sparkle.tar.xz" | shasum -a 256 -c -
          tar -xJ -f /tmp/Sparkle.tar.xz
          printf '%s' "$SPARKLE_PRIVATE_KEY" | ./bin/sign_update --ed-key-file - -p "spacemap-$VERSION-universal.dmg" > sig.txt
          export ED_SIGNATURE=$(tr -d '\r\n' < sig.txt)
          test -n "$ED_SIGNATURE"
          echo "ED_SIGNATURE computed"
          chmod +x .github/scripts/generate-appcast.sh
          .github/scripts/generate-appcast.sh

      - name: Verify release assets
        run: |
          assets=(
            "spacemap-${{ steps.version.outputs.tag }}-arm64.dmg"
            "spacemap-${{ steps.version.outputs.tag }}-x86_64.dmg"
            "spacemap-${{ steps.version.outputs.tag }}-universal.dmg"
            checksums.txt
            appcast.xml
          )
          for asset in "${assets[@]}"; do
            test -s "$asset" || { echo "::error::Missing or empty release asset: $asset"; exit 1; }
          done
          xmllint --noout appcast.xml
          item_count=$(awk '/<item>/{count++} END{print count+0}' appcast.xml)
          enclosure_count=$(awk '/<enclosure /{count++} END{print count+0}' appcast.xml)
          version_count=$(awk '/<sparkle:version>/{count++} END{print count+0}' appcast.xml)
          short_version_count=$(awk '/<sparkle:shortVersionString>/{count++} END{print count+0}' appcast.xml)
          current_version_count=$(awk -v version="${{ steps.version.outputs.tag }}" \
            'index($0, "<sparkle:version>" version "</sparkle:version>"){count++} END{print count+0}' \
            appcast.xml)
          if [ "$item_count" -lt 1 ] || [ "$item_count" -gt "$APPCAST_MAX_ITEMS" ] || \
             [ "$enclosure_count" -ne "$item_count" ] || [ "$version_count" -ne "$item_count" ] || \
             [ "$short_version_count" -ne "$item_count" ]; then
            echo "::error::Appcast history is incomplete or exceeds its retention limit"
            exit 1
          fi
          if [ "$current_version_count" -ne 1 ]; then
            echo "::error::Appcast must contain the current version exactly once"
            exit 1
          fi
          ls -lh "${assets[@]}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: spacemap ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            spacemap-*-arm64.dmg
            spacemap-*-x86_64.dmg
            spacemap-*-universal.dmg
            checksums.txt
            appcast.xml

      - name: Update docs branch with appcast
        run: |
          git fetch origin ${{ github.event.repository.default_branch }}
          git checkout -B ${{ github.event.repository.default_branch }} origin/${{ github.event.repository.default_branch }}
          mkdir -p docs
          cp appcast.xml docs/
          if [ ! -f docs/.nojekyll ]; then touch docs/.nojekyll; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml docs/.nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Update Sparkle appcast [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          else
            echo "No changes to appcast"
          fi

      - name: Cleanup keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
